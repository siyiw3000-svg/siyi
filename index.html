<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI數值方法｜每週作業</title>

<!-- =====================================================================
  ★ 資料區塊：之後每週只需要修改這一區 ★
  1. SITE：姓名、課程、學校系所、Email
  2. WEEKS：每週一筆，照著格式新增即可
     - status：「尚未上傳」或「已上傳」
     - 內文欄位：直接寫文字；要分段請用換行符號 \n
     - 還沒寫的欄位留空字串 "" ，網頁會自動顯示「尚未上傳」
     - links 的 url 留空 "" 時，該連結會顯示為「尚未上傳」
====================================================================== -->
<script>
const SITE = {
  name:   "王思誼",
  course: "AI數值方法｜每週作業",
  school: "淡江大學物理系",
  email:  "siyiw3000@gmail.com"
};

const WEEKS = [
  {
    week: 1,
    topic: "（待更新）",
    date: "（待更新）",
    status: "尚未上傳",
    requirement: "",   // 作業要求
    done:        "",   // 我做了什麼
    method:      "",   // 方法與結果
    difficulty:  "",   // 困難與解決
    learned:     "",   // 我學到什麼
    links: [           // 成品連結
      { label: "程式碼", url: "" },
      { label: "報告",   url: "" }
    ]
  },
  {
    week: 2,
    topic: "（待更新）",
    date: "（待更新）",
    status: "尚未上傳",
    requirement: "",
    done:        "",
    method:      "",
    difficulty:  "",
    learned:     "",
    links: [
      { label: "程式碼", url: "" },
      { label: "報告",   url: "" }
    ]
  }
];
</script>
<!-- ============================ 資料區塊結束 ============================ -->

<style>
:root {
  --bg: #fbfaf5;
  --paper: #fffef9;
  --ink: #23272e;
  --muted: #6b7280;
  --line: #d9d6c8;
  --grid: rgba(90, 130, 170, .10);
  --accent: #2f5d8a;
  --ok-bg: #e3f1e4;
  --ok-fg: #25602b;
  --todo-bg: #efece0;
  --todo-fg: #6b6650;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c;
    --paper: #1a1e25;
    --ink: #e6e8ec;
    --muted: #98a1ad;
    --line: #333a45;
    --grid: rgba(140, 170, 210, .07);
    --accent: #8fb8e6;
    --ok-bg: #213a25;
    --ok-fg: #9dd6a3;
    --todo-bg: #262b34;
    --todo-fg: #b3b8c2;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.8;
}
.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 16px 64px;
}

/* 頁首 */
header.top {
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 4px;
  padding: 24px 24px 20px;
}
header.top h1 {
  margin: 0 0 4px;
  font-size: 1.6rem;
  line-height: 1.4;
  letter-spacing: .02em;
}
header.top .name {
  font-size: 1.25rem;
  font-weight: 600;
  margin: 0;
}
header.top ul {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  color: var(--muted);
  font-size: .95rem;
}
header.top li { margin: 2px 0; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }

/* 總覽 */
h2 {
  margin: 40px 0 12px;
  font-size: 1.2rem;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--ink);
  display: inline-block;
}
.list-head, summary.row {
  display: grid;
  grid-template-columns: 4.5em 1fr 8em 6.5em;
  gap: 12px;
  align-items: center;
  padding: 10px 16px;
}
.list-head {
  color: var(--muted);
  font-size: .85rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}
details.week {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  margin-top: 10px;
}
details.week[open] { border-color: var(--accent); }
summary.row {
  cursor: pointer;
  list-style: none;
}
summary.row::-webkit-details-marker { display: none; }
summary.row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
summary.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.c-week { font-weight: 700; font-variant-numeric: tabular-nums; }
.c-week::after { content: " ▸"; color: var(--muted); font-weight: 400; }
details[open] .c-week::after { content: " ▾"; }
.c-date { color: var(--muted); font-size: .92rem; }
.badge {
  display: inline-block;
  padding: 1px 10px;
  border-radius: 999px;
  font-size: .85rem;
  background: var(--todo-bg);
  color: var(--todo-fg);
  white-space: nowrap;
  justify-self: start;
}
.badge.ok { background: var(--ok-bg); color: var(--ok-fg); }

/* 詳細內容 */
.detail {
  padding: 4px 20px 20px;
  border-top: 1px dashed var(--line);
}
.detail h3 {
  margin: 20px 0 4px;
  font-size: 1rem;
  color: var(--accent);
}
.detail p { margin: 0 0 .6em; }
.empty { color: var(--muted); font-style: italic; }
.links { list-style: none; margin: 0; padding: 0; }
.links li { margin: 2px 0; }

footer {
  margin-top: 48px;
  color: var(--muted);
  font-size: .85rem;
  text-align: center;
}

/* 手機 */
@media (max-width: 600px) {
  body { font-size: 16px; }
  .page { padding: 20px 12px 48px; }
  header.top { padding: 18px 16px 14px; }
  header.top h1 { font-size: 1.35rem; }
  .list-head { display: none; }
  summary.row {
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
  }
  .c-week { grid-column: 1; }
  .c-status { grid-column: 2; grid-row: 1; }
  .c-topic { grid-column: 1 / -1; font-weight: 500; }
  .c-date { grid-column: 1 / -1; }
  .detail { padding: 4px 16px 16px; }
}
@media print {
  body { background: #fff; }
  details.week > .detail { display: block; }
}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <h1 id="course"></h1>
    <p class="name" id="name"></p>
    <ul>
      <li id="school"></li>
      <li>Email：<a id="email"></a></li>
    </ul>
  </header>

  <main>
    <h2>作業總覽</h2>
    <div class="list-head" aria-hidden="true">
      <span>週次</span><span>主題</span><span>日期</span><span>狀態</span>
    </div>
    <div id="weeks"></div>
  </main>

  <footer id="foot"></footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  // 頁首
  document.title = SITE.course + "｜" + SITE.name;
  $("course").textContent = SITE.course;
  $("name").textContent = SITE.name;
  $("school").textContent = SITE.school;
  const mail = $("email");
  mail.textContent = SITE.email;
  mail.href = "mailto:" + SITE.email;
  $("foot").textContent = SITE.name + "　" + SITE.school;

  // 文字段落（以換行分段；空白則顯示「尚未上傳」）
  function addSection(parent, title, text) {
    parent.appendChild(el("h3", "", title));
    const t = (text || "").trim();
    if (!t) {
      parent.appendChild(el("p", "empty", "尚未上傳"));
      return;
    }
    t.split(/\n+/).forEach((line) => parent.appendChild(el("p", "", line)));
  }

  // 每週
  const box = $("weeks");
  const sorted = WEEKS.slice().sort((a, b) => a.week - b.week);
  sorted.forEach((w) => {
    const d = el("details", "week");
    const s = el("summary", "row");
    s.appendChild(el("span", "c-week", "第 " + w.week + " 週"));
    s.appendChild(el("span", "c-topic", w.topic || "—"));
    s.appendChild(el("span", "c-date", w.date || "—"));
    const b = el("span", "badge c-status", w.status || "尚未上傳");
    if (w.status === "已上傳") b.classList.add("ok");
    s.appendChild(b);
    d.appendChild(s);

    const body = el("div", "detail");
    addSection(body, "作業要求", w.requirement);
    addSection(body, "我做了什麼", w.done);
    addSection(body, "方法與結果", w.method);
    addSection(body, "困難與解決", w.difficulty);
    addSection(body, "我學到什麼", w.learned);

    body.appendChild(el("h3", "", "成品連結"));
    const ul = el("ul", "links");
    (w.links || []).forEach((l) => {
      const li = el("li");
      if (l.url && l.url.trim()) {
        const a = el("a", "", l.label);
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener";
        li.appendChild(a);
      } else {
        li.appendChild(document.createTextNode(l.label + "："));
        li.appendChild(el("span", "empty", "尚未上傳"));
      }
      ul.appendChild(li);
    });
    body.appendChild(ul);

    d.appendChild(body);
    box.appendChild(d);
  });
})();
</script>
</body>
</html>
